# Cargo configuration for `botlatro-core` — the native (Rust) core of
# the Balatro solver. See RUST_PORT_PLAN.md (project root) for the
# full porting roadmap.
#
# The crate compiles into a Python extension module named
# `balatro_core` (built by maturin). Existing Python code in
# `src/balatro_ai/` imports it via `from balatro_core import ...`
# with a try/except fallback to the Python implementation when the
# native module isn't available.

[package]
name = "botlatro-core"
version = "0.1.0"
edition = "2021"
description = "Native Rust core for the Balatro AI solver (forward_sim + hand_evaluator)."

[lib]
# `cdylib` produces the .pyd (Windows) / .so (Linux/Mac) shared library
# that Python loads as an extension module. `name` is what you see in
# `from <name> import ...`.
name = "balatro_core"
crate-type = ["cdylib"]

[dependencies]
# PyO3 is the Python-Rust binding. Version 0.22 is the current stable
# series with the new "Bound" API. We use the `extension-module`
# feature so the linker doesn't try to find libpython at build time
# (Python loads us dynamically instead).
pyo3 = { version = "0.22", features = ["extension-module"] }

[profile.release]
# Smaller binary + faster code at the cost of build time. Worth it
# for the production native module; debug builds (maturin develop)
# don't use this profile.
lto = "fat"
codegen-units = 1
opt-level = 3
