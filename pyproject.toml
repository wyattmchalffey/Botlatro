[build-system]
# Cython is needed at build time for the hand_evaluator_native extension
# (Tier 2 #4 of SOLVER_OPTIMIZATION_PLAN.md). The extension build is
# optional — `setup.py` falls back to a Python-only install if Cython
# isn't available — but declaring it here ensures `pip install -e .`
# picks it up automatically in a fresh environment.
requires = ["setuptools>=69", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "botlatro"
version = "0.1.0"
description = "Local research scaffolding for a Balatro-playing AI agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Private research project" }
authors = [{ name = "Botlatro contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
ml = [
  "gymnasium>=1",
  "numpy>=1.26",
  "pandas>=2",
  "torch>=2",
  "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
balatro_ai = ["data/*.json"]
